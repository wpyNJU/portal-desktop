name: Build paired client release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing version tag to build and publish, e.g. v1.1.1'
        required: true
        type: string
env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  preflight:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate version tag and unpublished release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG_CREATED: ${{ github.event.created }}
          TAG_FORCED: ${{ github.event.forced }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          EXPECTED_TAG="v$(node -p 'require("./package.json").version')"
          if [[ "$RELEASE_TAG" != "$EXPECTED_TAG" ]]; then
            echo "::error title=Version tag mismatch::Expected $EXPECTED_TAG from package.json, received $RELEASE_TAG"
            exit 1
          fi
          if [[ "$GITHUB_EVENT_NAME" == "push" && ( "$TAG_CREATED" != "true" || "$TAG_FORCED" == "true" ) ]]; then
            echo "::error title=Reused version tag::$RELEASE_TAG must be a newly created tag; publish a new version instead of moving an existing tag"
            exit 1
          fi
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "::error title=Duplicate release::$RELEASE_TAG already has a GitHub Release; publish a new version instead"
            exit 1
          fi
  build:
    needs: preflight
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, macos-15-intel, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      # Explicit distribution mode; never reuse the local-test bypass on tags.
      PORTAL_DESKTOP_MAC_ADHOC_RELEASE: '1'
      PORTAL_DESKTOP_UPDATE_REPOSITORY: ${{ vars.PORTAL_DESKTOP_UPDATE_REPOSITORY || github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Import Apple Developer ID certificate (same secrets as Heart Portal)
        if: runner.os == 'macOS' && env.PORTAL_DESKTOP_MAC_ADHOC_RELEASE != '1'
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          : "${APPLE_CERTIFICATE_BASE64:?Configure the Heart Portal signing certificate in this repository}"
          : "${APPLE_CERTIFICATE_PASSWORD:?Configure the Heart Portal certificate password in this repository}"
          KEYCHAIN_PATH="$RUNNER_TEMP/portal-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
          trap 'rm -f "$RUNNER_TEMP/certificate.p12" "$RUNNER_TEMP/DeveloperIDG2CA.cer"' EXIT
          umask 077
          echo "$APPLE_CERTIFICATE_BASE64" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$RUNNER_TEMP/certificate.p12" -P "$APPLE_CERTIFICATE_PASSWORD" -t cert -f pkcs12 -k "$KEYCHAIN_PATH" -T /usr/bin/codesign
          curl -fsSL https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer -o "$RUNNER_TEMP/DeveloperIDG2CA.cer"
          security import "$RUNNER_TEMP/DeveloperIDG2CA.cer" -k "$KEYCHAIN_PATH" -T /usr/bin/codesign || true
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain-db
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          echo "PORTAL_DESKTOP_MAC_KEYCHAIN=$KEYCHAIN_PATH" >> "$GITHUB_ENV"
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build:portal
      - run: npm test
      - name: Verify native Windows credential and task registration
        if: runner.os == 'Windows'
        env:
          PORTAL_DESKTOP_NATIVE_UPGRADE_TESTS: '1'
        run: npx vitest run tests/background-native.test.ts
      - run: cargo test --manifest-path heart-portal/Cargo.toml --locked -- --test-threads=1
      - name: Verify native Windows service upgrade and rollback
        if: runner.os == 'Windows'
        env:
          PORTAL_DESKTOP_NATIVE_UPGRADE_TESTS: '1'
        run: npx vitest run tests/runtime-update-native.test.ts
      - run: npm run make
      - name: Verify signed macOS DMG installation and Release ZIP upgrade preflight
        if: runner.os == 'macOS' && env.PORTAL_DESKTOP_MAC_ADHOC_RELEASE != '1'
        run: npm run test:macos-package
      - name: Verify ad-hoc macOS package integrity
        if: runner.os == 'macOS' && env.PORTAL_DESKTOP_MAC_ADHOC_RELEASE == '1'
        run: |
          set -euo pipefail
          APP="$(find out -maxdepth 3 -name 'Portal Desktop.app' -print -quit)"
          test -n "$APP"
          codesign --verify --deep --strict "$APP"
          codesign --verify --strict "$APP/Contents/Resources/heart-portal"
          find out/make -name '*.dmg' -exec hdiutil verify {} \;
      - name: Clean up Apple signing material
        if: runner.os == 'macOS' && env.PORTAL_DESKTOP_MAC_ADHOC_RELEASE != '1' && always()
        run: |
          security delete-keychain "$RUNNER_TEMP/portal-signing.keychain-db" || true
          rm -f "$RUNNER_TEMP/certificate.p12" "$RUNNER_TEMP/DeveloperIDG2CA.cer"
      - name: Verify NSIS installation and client Portal upgrade
        if: runner.os == 'Windows'
        shell: powershell
        run: npm run test:windows-upgrade
      - name: Upload Windows installer diagnostics
        if: runner.os == 'Windows' && always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer-diagnostics
          path: test-results/windows-installer/
          if-no-files-found: ignore
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: portal-desktop-${{ matrix.os }}
          path: |
            out/make/
            resources/runtime-bundle.json
          if-no-files-found: error
          retention-days: 30
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Validate all three platform packages and stage checksums
        run: node scripts/stage-release.mjs artifacts release "$(node -p 'require("./package.json").version')"
      - name: Publish the complete Windows and macOS release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$RELEASE_TAG" --verify-tag --draft --title "Portal Desktop $RELEASE_TAG" --notes-file desktop/RELEASE_NOTES.md
          gh release upload "$RELEASE_TAG" release/*
          gh release edit "$RELEASE_TAG" --draft=false --latest
# Only a matching new version tag builds. Publication waits for all three native
# builds and package checks; incomplete releases stay drafts if upload fails.
